* { box-sizing: border-box; }
html, body { margin: 0; }
body { overflow-x: clip; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--page); color: var(--ink); min-height: 100vh; font-size: 14px; line-height: 1.4; }
.wrap { max-width: 1680px; margin: 0 auto; padding: 0 20px; }

.tile-stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

.seg button:hover:not([aria-pressed="true"]) { background: var(--grid); }
.lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: -6px; }
input[type="search"] { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--axis); border-radius: 7px; background: var(--surface); color: var(--ink); width: 210px; }

.chain .num { font-size: 11px; color: var(--muted); font-weight: 650; letter-spacing: .06em; }

.rbar div:last-child { border-radius: 0 3px 3px 0; }
.rbar div:only-child { border-radius: 3px; }
.top5 { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 12px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.top5 .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.top5 .n:hover { text-decoration: underline; }
.top5 .c { color: var(--ink2); text-align: right; }
.world { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(300px, 1fr); gap: 12px; }
@media (max-width: 980px) { .world { grid-template-columns: 1fr; } }
#worldmap { padding: 6px; }
#worldmap svg { display: block; }
.land { fill: var(--land); stroke: var(--surface); stroke-width: .6; }
.bub { cursor: pointer; }
.bub-label { font-size: 11px; font-weight: 650; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; pointer-events: none; }

.rank { padding: 12px 14px; }
.rank h3, .panel h3 { margin: 0 0 8px; font-size: 14px; }
.rank .r { display: grid; grid-template-columns: 112px 1fr 64px 52px; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 4px; border-radius: 5px; cursor: pointer; font-variant-numeric: tabular-nums; }
.rank .r:hover, .rank .r.sel { background: var(--grid); }
.rank .bar { height: 8px; background: var(--s1); border-radius: 0 3px 3px 0; min-width: 2px; }
.rank .v { text-align: right; }
.rank .c { text-align: right; color: var(--ink2); }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 12px; margin-top: 12px; }
.panel { padding: 14px 16px; }
.panel .note { font-size: 12px; color: var(--ink2); margin: -2px 0 10px; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-weight: 600; color: var(--ink2); font-size: 11.5px; padding: 7px 8px; border-bottom: 1px solid var(--axis); background: var(--surface); white-space: nowrap; user-select: none; }
#table th { position: sticky; top: var(--fh, 50px); cursor: pointer; z-index: 2; }
table.t th.num, table.t td.num { text-align: right; }
table.t td { padding: 5px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.t tr.row { cursor: pointer; }
table.t tr.row:hover td { background: var(--grid); }
table.t td.wrapc { white-space: normal; min-width: 220px; color: var(--ink2); }
.mk { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
@media (max-width: 1100px) { .tbl-wrap { overflow-x: auto; } #table th { top: 0; } }
@media (max-width: 760px) { .filters { position: static; } .seg { max-width: 100%; overflow-x: auto; } .seg button { flex: none; white-space: nowrap; } .legend { flex-wrap: wrap; } .legend .ramp { width: 120px; } input[type="search"] { width: 100%; } .wrap { padding: 0 12px; } h1 { font-size: 20px; } .tile-stat { min-width: 0; flex: 1; } }
.tag { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--axis); color: var(--ink2); }
#drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 380px; max-width: 100vw; background: var(--surface); border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,.15); z-index: 40; transform: translateX(105%); transition: transform .18s ease; overflow-y: auto; padding: 18px 20px 30px; }
#drawer.open { transform: none; }
#drawer .x { position: absolute; right: 12px; top: 10px; border: 0; background: var(--grid); color: var(--ink); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 15px; }
#drawer h2 { margin: 0 34px 2px 0; font-size: 19px; }
#drawer .m { color: var(--ink2); font-size: 13px; }
#drawer .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 12px 0; font-variant-numeric: tabular-nums; }
#drawer .kv span:nth-child(odd) { color: var(--muted); }
#drawer .rets { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; border: 1px solid var(--grid); border-radius: 8px; padding: 8px 0; font-variant-numeric: tabular-nums; }
#drawer .rets .k { font-size: 11px; color: var(--muted); }
#drawer .rets .v { font-weight: 650; }
.spark-wrap { margin: 14px 0 4px; }
.spark-read { font-size: 12px; color: var(--ink2); height: 16px; font-variant-numeric: tabular-nums; }
.about { max-width: 860px; font-size: 14px; color: var(--ink); }
.about h3 { margin: 22px 0 6px; font-size: 15px; }

footer { color: var(--muted); font-size: 12px; padding: 20px 0 30px; border-top: 1px solid var(--grid); }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
@media (forced-colors: active) { .rbar div, .rank .bar { forced-color-adjust: none; } }
</style>

const DATA = /*__DATA__*/;</script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const REGIONS = [
  {id: "us", name: "United States", slot: 1}, {id: "cn", name: "China & HK", slot: 2},
  {id: "tw", name: "Taiwan", slot: 3}, {id: "jp", name: "Japan", slot: 4},
  {id: "kr", name: "South Korea", slot: 5}, {id: "eu", name: "Europe", slot: 6},
  {id: "row", name: "Rest of world", slot: 7},
];
const REGION = Object.fromEntries(REGIONS.map(r => [r.id, r]));
const PERIODS = [["1d", "1D"], ["1w", "1W"], ["1m", "1M"], ["ytd", "YTD"], ["1y", "1Y"]];
const PERIOD_NAME = {"1d": "1 day", "1w": "1 week", "1m": "1 month", ytd: "year to date", "1y": "1 year"};
const DOMAIN = {"1d": 5, "1w": 10, "1m": 20, ytd: 80, "1y": 100};
const TIER_NAME = {core: "Core", high: "High", partial: "Partial"};
const VIEWS = [["map", "Map"], ["chain", "Value chain"], ["world", "World"], 
               ["ipo", "New & upcoming listings"], ["table", "Table"], ["about", "Method"]];

const C = DATA.companies;
const LAYER = Object.fromEntries(DATA.layers.map((l, i) => [l.id, {...l, i}]));
C.forEach(d => { d.reg = DATA.countries[d.c].region; d.cn = DATA.countries[d.c].name; });
const BY_T = Object.fromEntries(C.map(d => [d.t, d]));

const state = {view: "map", period: "ytd", region: "all", tier: "all", q: "",
               size: "cap", layer: null, country: null, sort: {k: "mc", d: -1}};
const hv = location.hash.slice(1);
if (VIEWS.some(v => v[0] === hv)) state.view = hv;

// ---------- helpers ----------
let TH = {};
function readTheme() {
  const cs = getComputedStyle($(".viz-root"));
  for (const k of ["mid","up","down","na","ink","ink2","muted","surface","land","grid","axis","page","s1","s2","s3","s4","s5","s6","s7"])
    TH[k] = cs.getPropertyValue("--" + k).trim();
}
const fmtCap = v => v == null ? "—" : v >= 1e12 ? `$${(v / 1e12).toFixed(v >= 1e13 ? 1 : 2)}T`
  : v >= 1e9 ? `$${(v / 1e9).toFixed(v >= 1e11 ? 0 : 1)}B` : `$${(v / 1e6).toFixed(0)}M`;
const fmtPct = r => r == null ? "—" : `${r > 0 ? "+" : r < 0 ? "−" : ""}${Math.abs(r).toFixed(Math.abs(r) >= 100 ? 0 : 1)}%`;
const arrow = r => r == null ? "" : r > 0 ? "▲ " : r < 0 ? "▼ " : "";
function retColor(r) {
  if (r == null) return TH.na;
  const t = Math.max(-1, Math.min(1, r / DOMAIN[state.period]));
  return d3.interpolateLab(TH.mid, t >= 0 ? TH.up : TH.down)(Math.pow(Math.abs(t), 0.75));
}
const textOn = fill => d3.lab(fill).l > 60 ? "#0b0b0b" : "#ffffff";
function capRet(list, p) {
  let now = 0, then = 0;
  for (const d of list) { const r = d.r[p]; if (r == null || !d.mc) continue; now += d.mc; then += d.mc / (1 + r / 100); }
  return then ? (now / then - 1) * 100 : null;
}
function matches(d, ignore = {}) {
  if (!ignore.region && state.region !== "all" && d.reg !== state.region) return false;
  if (!ignore.country && state.country && d.c !== state.country) return false;
  if (!ignore.layer && state.layer && d.l !== state.layer) return false;
  if (state.tier === "corehigh" && d.tier === "partial") return false;
  if (state.tier === "core" && d.tier !== "core") return false;
  if (state.q) {
    const hay = `${d.n} ${d.t} ${d.lab} ${d.s} ${d.note} ${d.cn} ${LAYER[d.l].name}`.toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
const filtered = ignore => C.filter(d => matches(d, ignore));
function fitText(s, maxW, fs) {
  const per = fs * 0.6;
  if (s.length * per <= maxW) return s;
  const n = Math.floor(maxW / per) - 1;
  return n > 2 ? s.slice(0, n) + "…" : "";
}

// ---------- tooltip ----------
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.display = "block"; moveTip(e); }
function moveTip(e) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = Math.max(8, e.clientY - h - pad);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };
function companyTip(d) {
  const r = d.r;
  return `<b>${esc(d.n)}</b> <span class="m">${esc(d.t)} · ${esc(d.cn)}</span><br>
  <span class="m">${esc(LAYER[d.l].name)} › ${esc(d.s)} · ${TIER_NAME[d.tier]} AI exposure</span><br>
  Mkt cap <b>${fmtCap(d.mc)}</b>${d.ipo ? ` · <span class="m">trading since ${d.ipo}</span>` : ""}

// ---------- MAP (treemap) ----------
function legendRamp() {
  const m = DOMAIN[state.period];
  const stops = d3.range(0, 1.0001, 0.1).map(t => retColor(-m + 2 * m * t));
  return `<span class="item">${fmtPct(-m)}</span><span class="ramp" style="background:linear-gradient(90deg,${stops.join(",")})"></span><span class="item">${fmtPct(m)}</span>
    <span class="item"><span class="sw" style="background:${TH.na}"></span>no history</span>
    <span class="item" style="color:var(--muted)">${PERIOD_NAME[state.period]} return, clamped at ±${m}%</span>`;
}
function renderMap() {
  $("#map-legend").innerHTML = legendRamp();
  const host = $("#treemap"); host.innerHTML = "";
  const list = filtered();
  if (!list.length) { host.innerHTML = `<p class="empty">No companies match these filters.</p>`; return; }
  const W = host.clientWidth, H = W < 700 ? Math.round(W * 1.9) : Math.round(Math.max(520, Math.min(innerHeight - 230, W * 0.62)));
  const groups = d3.groups(list, d => d.l).map(([l, ch]) => ({layer: LAYER[l], children: ch}));
  const root = d3.hierarchy({children: groups})
    .sum(d => d.mc ? (state.size === "sqrt" ? Math.sqrt(d.mc) : d.mc) : 0)
    .sort((a, b) => b.value - a.value);
  d3.treemap().size([W, H]).tile(d3.treemapSquarify.ratio(1)).paddingOuter(2)
    .paddingTop(d => d.depth === 1 ? 18 : 0).paddingInner(2).round(true)(root);
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H)
    .attr("role", "img").attr("aria-label", "Treemap of AI companies by market cap, grouped by value-chain layer");
  const grp = svg.selectAll("g.grp").data(root.children).join("g").attr("class", "grp");
  grp.append("rect").attr("class", "grp-bg").attr("x", d => d.x0).attr("y", d => d.y0)
    .attr("width", d => d.x1 - d.x0).attr("height", d => d.y1 - d.y0);
  grp.append("text").attr("class", "grp-label").attr("x", d => d.x0 + 4).attr("y", d => d.y0 + 13)
    .text(d => fitText(`${d.data.layer.name.toUpperCase()} ${fmtCap(d3.sum(d.leaves(), l => l.data.mc))}`, d.x1 - d.x0 - 8, 10.5))
    .on("click", (e, d) => setLayer(d.data.layer.id))
    .append("title").text(d => `${d.data.layer.name}: click to ${state.layer ? "zoom out" : "zoom in"}`);
  const tiles = svg.append("g").selectAll("g.tile").data(root.leaves()).join("g").attr("class", "tile")
    .attr("transform", d => `translate(${d.x0},${d.y0})`)
    .on("mouseenter", (e, d) => showTip(e, companyTip(d.data))).on("mousemove", moveTip).on("mouseleave", hideTip)
    .on("click", (e, d) => openDrawer(d.data));
  tiles.append("rect").attr("width", d => Math.max(0, d.x1 - d.x0)).attr("height", d => Math.max(0, d.y1 - d.y0))
    .attr("rx", 2).attr("fill", d => retColor(d.data.r[state.period]));
  tiles.each(function (d) {
    const w = d.x1 - d.x0, h = d.y1 - d.y0, c = d.data;
    if (w < 26 || h < 14) return;
    const fill = retColor(c.r[state.period]), col = textOn(fill);
    let fs = Math.min(34, h / 2.6, (w - 6) / (c.lab.length * 0.62));
    let lab = c.lab;
    if (fs < 9) { fs = Math.min(h / 1.8, 11); lab = fitText(c.lab, w - 4, fs); if (!lab || fs < 7.5) return; }
    const g = d3.select(this);
    const showRet = h >= fs * 2.35 && w >= 34;
    const showCap = h >= fs * 3.6 && w >= 70;
    const lines = 1 + showRet + showCap;
    const y0 = h / 2 - (lines - 1) * fs * 0.5;
    g.append("text").attr("x", w / 2).attr("y", y0).attr("dy", "0.35em").attr("text-anchor", "middle")
      .attr("font-size", fs).attr("fill", col).text(lab);
    if (showRet) g.append("text").attr("class", "ret").attr("x", w / 2).attr("y", y0 + fs * 0.95).attr("dy", "0.35em")
      .attr("text-anchor", "middle").attr("font-size", Math.max(9, fs * 0.62)).attr("fill", col).text(fmtPct(c.r[state.period]));
    if (showCap) g.append("text").attr("class", "ret").attr("x", w / 2).attr("y", y0 + fs * 1.75).attr("dy", "0.35em")
      .attr("text-anchor", "middle").attr("font-size", Math.max(9, fs * 0.5)).attr("fill", col).attr("opacity", 0.85).text(fmtCap(c.mc));
  });
}

function regionBar(list) {

// ---------- WORLD ----------
const land = topojson.feature(WORLD, WORLD.objects.countries);
land.features = land.features.filter(f => f.id !== "010");
function renderWorld() {
  const list = filtered({country: true});
  const by = d3.rollups(list, v => ({mc: d3.sum(v, d => d.mc), n: v.length, list: v}), d => d.c)
    .map(([c, o]) => ({c, ...o, ...DATA.countries[c]})).sort((a, b) => b.mc - a.mc);
  const total = d3.sum(by, d => d.mc) || 1;
  const host = $("#worldmap"); host.innerHTML = "";
  const W = host.clientWidth - 12, H = Math.round(W * 0.52);
  const proj = d3.geoNaturalEarth1().fitExtent([[4, 4], [W - 4, H - 4]], land);
  const path = d3.geoPath(proj);
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H).attr("role", "img")
    .attr("aria-label", "World map: AI market cap by headquarters country");
  svg.append("g").selectAll("path").data(land.features).join("path").attr("class", "land").attr("d", path);
  const r = d3.scaleSqrt().domain([0, d3.max(by, d => d.mc) || 1]).range([0, Math.min(W, H) * 0.17]);
  const g = svg.append("g").selectAll("g").data(by).join("g").attr("class", "bub")
    .attr("transform", d => `translate(${proj([d.lon, d.lat])})`)
    .on("mouseenter", (e, d) => showTip(e, countryTip(d, total))).on("mousemove", moveTip).on("mouseleave", hideTip)
    .on("click", (e, d) => setCountry(d.c));
  g.append("circle").attr("r", d => Math.max(3, r(d.mc))).attr("fill", TH.s1).attr("fill-opacity", 0.45)
    .attr("stroke", d => state.country === d.c ? TH.ink : TH.surface).attr("stroke-width", d => state.country === d.c ? 2.5 : 2);
  g.append("circle").attr("r", d => Math.max(14, r(d.mc))).attr("fill", "transparent");
  const placed = [];
  const hit = b => placed.some(o => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y);
  const labels = svg.append("g");
  by.forEach(d => {
    const [cx, cy] = proj([d.lon, d.lat]), rr = Math.max(3, r(d.mc));
    if (rr < 7 && placed.length > 9) return;
    const w = Math.max(d.name.length, 7) * 6.6, h = 26;
    const spots = rr > 26 ? [[0, 0]] : [[rr + 4 + w / 2, 0], [0, rr + 4 + h / 2], [-(rr + 4 + w / 2), 0], [0, -(rr + 4 + h / 2)]];
    for (const [dx, dy] of spots) {
      const b = {x: cx + dx - w / 2, y: cy + dy - h / 2, w, h};
      if (b.x < 0 || b.x + w > W || b.y < 0 || b.y + h > H || hit(b)) continue;
      placed.push(b);
      const t = labels.append("g").attr("transform", `translate(${cx + dx},${cy + dy})`);
      t.append("text").attr("class", "bub-label").attr("text-anchor", "middle").attr("dy", "-0.15em").text(d.name);
      t.append("text").attr("class", "bub-sub").attr("text-anchor", "middle").attr("dy", "1.05em").text(fmtCap(d.mc));
      break;
    }
  });
  const max = by[0] ? by[0].mc : 1;
  $("#rank").innerHTML = `<h3>AI market cap by HQ country</h3>
    <div class="r" style="cursor:default;color:var(--muted);font-size:11px"><span>Country</span><span>Share of shown cap</span><span class="v">Cap</span><span class="c">${PERIODS.find(p => p[0] === state.period)[1]}</span></div>
    ${by.map(d => `<div class="r ${state.country === d.c ? "sel" : ""}" data-c="${d.c}"><span>${esc(d.name)} <span style="color:var(--muted)">${d.n}</span></span>
      <span style="display:flex;align-items:center;gap:6px"><span class="bar" style="width:${Math.max(0.5, 100 * d.mc / max)}%"></span><span style="color:var(--ink2);font-size:11.5px">${(100 * d.mc / total).toFixed(1)}%</span></span>
      <span class="v">${fmtCap(d.mc)}</span><span class="c">${fmtPct(capRet(d.list, state.period))}</span></div>`).join("")}`;
  $("#rank").querySelectorAll("[data-c]").forEach(el => { el.onclick = () => setCountry(el.dataset.c); });
}
function countryTip(d, total) {
  const top = d.list.slice().sort((a, b) => b.mc - a.mc).slice(0, 6);
  return `<b>${esc(d.name)}</b> <span class="m">${REGION[d.region].name}</span><br>
    ${fmtCap(d.mc)} · ${(100 * d.mc / total).toFixed(1)}% of shown AI cap · ${d.n} companies<br>
    <span class="m">Cap-weighted ${PERIODS.find(p => p[0] === state.period)[1]}: ${fmtPct(capRet(d.list, state.period))}</span>
    <div style="margin-top:6px">${top.map(c => `${esc(c.n)} <span class="m">${fmtCap(c.mc)}</span>`).join("<br>")}</div>
    <div class="m" style="margin-top:6px">Click to filter every view to ${esc(d.name)}</div>`;
}

// ---------- TABLE ----------
const COLS = [
  ["rank", "#", d => 0, "num"], ["n", "Company", d => d.n], ["t", "Ticker", d => d.t], ["cn", "HQ", d => d.cn],
  ["l", "Layer", d => LAYER[d.l].i], ["s", "Segment", d => d.s], ["tier", "AI exposure", d => ({core: 0, high: 1, partial: 2})[d.tier]],
  ["mc", "Mkt cap", d => d.mc, "num"], ...PERIODS.map(([k, l]) => [k, l, d => d.r[k], "num"]),
];
function renderTable() {
  const list = filtered();
  const col = COLS.find(c => c[0] === state.sort.k) || COLS[7];
  const dir = state.sort.d;
  list.sort((a, b) => {
    const x = col[2](a), y = col[2](b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
  const sw = r => `<span class="mk" style="background:${retColor(r)}"></span>`;
  $("#table").innerHTML = `<thead><tr>${COLS.map(([k, l, , cls]) => `<th class="${cls || ""}" data-k="${k}">${l}${state.sort.k === k ? (dir < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead>
    <tbody>${list.map((d, i) => `<tr class="row" data-t="${esc(d.t)}"><td class="num" style="color:var(--muted)">${i + 1}</td><td><b>${esc(d.n)}</b></td><td>${esc(d.t)}</td><td>${esc(d.cn)}</td>
      <td>${esc(LAYER[d.l].name)}</td><td>${esc(d.s)}</td><td>${TIER_NAME[d.tier]}</td><td class="num">${fmtCap(d.mc)}</td>
      ${PERIODS.map(([k]) => `<td class="num">${k === state.period ? sw(d.r[k]) : ""}${fmtPct(d.r[k])}</td>`).join("")}</tr>`).join("")}</tbody>`;
  $("#table").querySelectorAll("th").forEach(th => { th.onclick = () => {
    const k = th.dataset.k; if (k === "rank") return;
    state.sort = {k, d: state.sort.k === k ? -state.sort.d : (["n", "t", "cn", "s", "l", "tier"].includes(k) ? 1 : -1)}; renderTable(); }; });
  $("#table").querySelectorAll("tr.row").forEach(tr => { tr.onclick = () => openDrawer(BY_T[tr.dataset.t]); });
}

      <li><b>Partial</b> (${tiers.get("partial") || 0}): AI is meaningful but a minority of the story (Apple, Cisco, IT-services firms).</li></ul>
    <h3>Data</h3><ul>
      <li>Prices, market caps and history come from ${esc(DATA.source)}, pulled ${esc(DATA.asof)}. Market caps are converted to USD at spot FX: ${Object.entries(DATA.fx).filter(([k]) => k !== "USD").map(([k, v]) => `${k} ${v.toPrecision(4)}`).join(", ")}.</li>
      <li>Returns use split- and dividend-adjusted closes in local currency. YTD runs from the last close of the previous year. Cap-weighted returns weight each company by its starting market cap. Companies without enough history show "—".</li>
      <li>Universe changes since 2025 (new IPOs, mergers, delistings) were checked against news reporting on ${esc(DATA.asof.slice(0, 10))}. Recent removals: Juniper (now HPE), Ansys (Synopsys), Alphawave (Qualcomm), Confluent (IBM), CyberArk (Palo Alto), Informatica (Salesforce), Shinko Electric (taken private). Pure Storage now trades as Everpure (P).</li>
      ${DATA.missing.length ? `<li>No market data for: ${DATA.missing.map(m => esc(m.t)).join(", ")}.</li>` : ""}
      ${DATA.stale.length ? `<li>Stale quotes (no trade in 7+ days): ${DATA.stale.map(m => esc(m.ticker)).join(", ")}.</li>` : ""}
    </ul>
    <h3>Updates</h3><p>Prices refresh about every hour, around the clock on weekdays, so Asian, European and US sessions are all covered. The universe and the IPO pipeline are curated by hand. <a href="https://github.com/luckeyfaraday/ai-stock-atlas" target="_blank" rel="noopener">Source and data on GitHub</a>; corrections and additions welcome as issues.</p>
    <h3>Not investment advice</h3><p>This is a map, not a recommendation. Tier and layer assignments are judgement calls.</p>`;
}

// ---------- DRAWER ----------
function openDrawer(d) {
  hideTip();
  const dr = $("#drawer");
  const peers = C.filter(x => x.l === d.l && x.s === d.s && x.t !== d.t).sort((a, b) => b.mc - a.mc).slice(0, 6);
  dr.innerHTML = `<button class="x" aria-label="Close">✕</button>
    <h2>${esc(d.n)}</h2><div class="m">${esc(d.t)} · ${esc(d.ex || "")} · ${esc(d.cn)}</div>
    <p style="margin:10px 0 0">${esc(d.note)}</p>
    <div class="kv"><span>Layer</span><span>${esc(LAYER[d.l].name)} › ${esc(d.s)}</span>
      <span>AI exposure</span><span>${TIER_NAME[d.tier]}</span>
      <span>Market cap</span><span>${fmtCap(d.mc)}</span>
      <span>Last price</span><span>${d.p.toLocaleString(undefined, {maximumFractionDigits: 2})} ${esc(d.cur)} <span style="color:var(--muted)">(${esc(d.lb)})</span></span>
      ${d.listed ? `<span>Listed</span><span>${esc(d.listed)}</span>` : ""}
</div>
    <div class="rets">${PERIODS.map(([k, l]) => `<div><div class="k">${l}</div><div class="v">${fmtPct(d.r[k])}</div></div>`).join("")}</div>
    <div class="spark-wrap" id="spark"></div><div class="spark-read" id="spark-read">Weekly close, ${d.ipo ? "since listing" : "last 12 months"} (${esc(d.cur)}) · hover to read</div>
    ${peers.length ? `<h3 style="font-size:13px;margin:16px 0 6px">Peers in ${esc(d.s)}</h3><div class="top5">${peers.map(x => `<span class="n" data-t="${esc(x.t)}">${esc(x.n)} <span style="color:var(--muted)">${esc(x.c)}</span></span><span class="c">${fmtCap(x.mc)}</span><span class="c">${fmtPct(x.r[state.period])}</span>`).join("")}</div>` : ""}
    <p style="margin-top:16px"><a href="https://finance.yahoo.com/quote/${encodeURIComponent(d.t)}" target="_blank" rel="noopener">Open on Yahoo Finance ↗</a></p>`;
  dr.classList.add("open");
  dr.querySelector(".x").onclick = () => dr.classList.remove("open");
  bindDataTips(dr);
  drawSpark(d);
}
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#drawer").classList.remove("open"); });
function drawSpark(d) {
  const host = $("#spark"), vals = d.sp;
  if (!vals || vals.length < 2) { host.innerHTML = `<p class="m">Not enough history yet.</p>`; return; }
  const W = 340, H = 120, m = {l: 4, r: 4, t: 8, b: 8};
  const last = new Date(d.lb + "T00:00:00Z");
  const dates = vals.map((_, i) => new Date(last - (vals.length - 1 - i) * 7 * 864e5));
  const x = d3.scaleLinear().domain([0, vals.length - 1]).range([m.l, W - m.r]);
  const y = d3.scaleLinear().domain(d3.extent(vals)).nice().range([H - m.b, m.t]);
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H);
  svg.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(vals[0])).attr("y2", y(vals[0])).attr("stroke", TH.axis).attr("stroke-width", 1);
  svg.append("path").attr("d", d3.line().x((v, i) => x(i)).y(v => y(v))(vals)).attr("fill", "none").attr("stroke", TH.s1).attr("stroke-width", 2).attr("stroke-linejoin", "round");
  const cross = svg.append("line").attr("y1", m.t).attr("y2", H - m.b).attr("stroke", TH.muted).attr("opacity", 0);
  const dot = svg.append("circle").attr("r", 4).attr("fill", TH.s1).attr("stroke", TH.surface).attr("stroke-width", 2).attr("opacity", 0);
  const read = $("#spark-read"), base = read.textContent;
  svg.append("rect").attr("width", W).attr("height", H).attr("fill", "transparent")
    .on("mousemove", e => {
      const i = Math.max(0, Math.min(vals.length - 1, Math.round(x.invert(d3.pointer(e)[0]))));
      cross.attr("x1", x(i)).attr("x2", x(i)).attr("opacity", 1); dot.attr("cx", x(i)).attr("cy", y(vals[i])).attr("opacity", 1);
      read.textContent = `Week of ${dates[i].toISOString().slice(0, 10)}: ${vals[i].toLocaleString(undefined, {maximumFractionDigits: 2})} ${d.cur} · ${fmtPct((vals[vals.length - 1] / vals[i] - 1) * 100)} since`;
    })
    .on("mouseleave", () => { cross.attr("opacity", 0); dot.attr("opacity", 0); read.textContent = base; });
}

// ---------- boot ----------
function renderAll() {
  renderControls(); renderHeader();
  document.documentElement.style.setProperty("--fh", $(".filters").offsetHeight + "px");
  ({map: renderMap, chain: renderChain, world: renderWorld, ipo: renderIpo, table: renderTable, about: renderAbout})[state.view]();
}
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(renderAll, 150); });
window.ATLAS_DEBUG = {state, renderAll, set: o => { Object.assign(state, o); renderAll(); }, openDrawer: t => openDrawer(BY_T[t])};
applyTheme();
renderAll();
</script>
